version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          npm-dependencies:
              patterns:
                  - '*'
      ignore:
          # chokidar 6 needs Node >= 22.22, above our `engines` floor
          # (^20.19.0 || >=22.12.0). Lift this together with the floor.
          - dependency-name: chokidar
            update-types: ['version-update:semver-major']
      open-pull-requests-limit: 5
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          github-actions:
              patterns:
                  - '*'
      open-pull-requests-limit: 5
