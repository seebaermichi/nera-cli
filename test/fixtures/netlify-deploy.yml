# Generated by `nera publish` (@nera-static/nera).
# It builds the site and deploys it on every push to main. `nera publish`
# rewrites this file while its first line is unchanged; remove that line to
# keep your own edits.

name: Deploy to Netlify

on:
    push:
        branches: [main]
    # Allow a manual run from the Actions tab.
    workflow_dispatch:

# Least-privilege token: read the repository. The deploy job adds what its
# host needs.
permissions:
    contents: read

# Never run two deploys at once; let an in-progress run finish rather than
# cancelling it mid-publish.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Plugins keep their work in .nera-cache (plugin-images its encoded
            # images), so a build re-encodes only what changed. The key changes
            # with what a variant comes from (images in the site's and a local
            # theme's assets, pages asking for variants, the images config, an
            # npm theme through the lockfile), since a cache with an existing
            # key is never overwritten; restore-keys falls back to the newest.
            - name: Restore the build cache
              uses: actions/cache@v6
              with:
                  path: .nera-cache
                  key: nera-cache-${{ hashFiles('assets/**', 'theme/assets/**', 'pages/**', 'config/images.yaml', 'package-lock.json') }}
                  restore-keys: nera-cache-

            - name: Render site
              run: npm run build

            - name: Upload the built site
              uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: public
                  if-no-files-found: error

    deploy:
        needs: build
        permissions:
            contents: read
        runs-on: ubuntu-latest
        steps:
            - name: Download the built site
              uses: actions/download-artifact@v8
              with:
                  name: site
                  path: public
            - name: Deploy to Netlify
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
              run: |
                  set -euo pipefail
                  api='https://api.netlify.com/api/v1'
                  auth="Authorization: Bearer $NETLIFY_AUTH_TOKEN"

                  # Fail with Netlify's message when the last answer (in deploy.json) is not 2xx.
                  check() {
                      if [ "$1" -lt 200 ] || [ "$1" -ge 300 ]; then
                          echo "::error::Netlify answered $1 to $2: $(jq -r '.message // .error // empty' deploy.json 2>/dev/null || true)"
                          exit 1
                      fi
                  }

                  (cd public && zip -qr ../site.zip .)
                  code=$(curl -sS --max-time 600 -o deploy.json -w '%{http_code}' -X POST \
                      -H "$auth" -H 'Content-Type: application/zip' --data-binary @site.zip \
                      "$api/sites/$NETLIFY_SITE_ID/deploys")
                  check "$code" 'the upload'
                  id=$(jq -r '.id // empty' deploy.json)
                  if [ -z "$id" ]; then
                      echo '::error::Netlify sent no deploy id for the upload.'
                      exit 1
                  fi

                  for _ in $(seq 1 60); do
                      code=$(curl -sS --max-time 30 -o deploy.json -w '%{http_code}' -H "$auth" "$api/deploys/$id")
                      check "$code" 'the deploy poll'
                      case "$(jq -r '.state' deploy.json)" in
                          ready)
                              echo "Deployed to $(jq -r '.ssl_url // .url' deploy.json)"
                              exit 0
                              ;;
                          error)
                              echo "::error::Netlify could not deploy the site: $(jq -r '.error_message // "no reason given"' deploy.json)"
                              exit 1
                              ;;
                      esac
                      sleep 5
                  done
                  echo '::error::The Netlify deploy did not finish within 5 minutes.'
                  exit 1
