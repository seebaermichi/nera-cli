# Generated by `nera publish` (@nera-static/nera).
# It builds the site and deploys it on every push to main. `nera publish`
# rewrites this file while its first line is unchanged; remove that line to
# keep your own edits.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # Allow a manual run from the Actions tab.
    workflow_dispatch:

# Least-privilege token: read the repository. The deploy job adds what its
# host needs.
permissions:
    contents: read

# Never run two deploys at once; let an in-progress run finish rather than
# cancelling it mid-publish.
concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Plugins keep their work in .nera-cache (plugin-images its encoded
            # images), so a build re-encodes only what changed. The key changes
            # with what a variant comes from (images in the site's and a local
            # theme's assets, pages asking for variants, the images config, an
            # npm theme through the lockfile), since a cache with an existing
            # key is never overwritten; restore-keys falls back to the newest.
            - name: Restore the build cache
              uses: actions/cache@v6
              with:
                  path: .nera-cache
                  key: nera-cache-${{ hashFiles('assets/**', 'theme/assets/**', 'pages/**', 'config/images.yaml', 'package-lock.json') }}
                  restore-keys: nera-cache-

            - name: Render site
              run: npm run build

            - name: Upload the built site
              uses: actions/upload-artifact@v7
              with:
                  name: site
                  path: public
                  if-no-files-found: error

    deploy:
        needs: build
        permissions:
            contents: read
            pages: write
            id-token: write
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Download the built site
              uses: actions/download-artifact@v8
              with:
                  name: site
                  path: public
            - name: Configure Pages
              uses: actions/configure-pages@v6
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: public
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
